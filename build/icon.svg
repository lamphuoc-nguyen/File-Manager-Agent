<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- File Manager app icon: a folder being tidied by AI (sparkle). Source for icon.png / icon.ico. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8cff"/>
      <stop offset="1" stop-color="#1747b0"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd95e"/>
      <stop offset="1" stop-color="#f2b200"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>

  <!-- folder back with tab -->
  <path d="M96 176a28 28 0 0 1 28-28h86l36 36h142a28 28 0 0 1 28 28v172a28 28 0 0 1-28 28H124a28 28 0 0 1-28-28z" fill="#c98a00"/>
  <!-- paper sticking out -->
  <rect x="134" y="200" width="244" height="140" rx="14" fill="#ffffff"/>
  <!-- folder front -->
  <path d="M82 244a26 26 0 0 1 26-26h296a26 26 0 0 1 26 26l-14 136a28 28 0 0 1-28 26H124a28 28 0 0 1-28-26z" fill="url(#front)"/>
  <!-- tidy rows -->
  <rect x="146" y="276" width="168" height="20" rx="10" fill="#ffffff" opacity="0.6"/>
  <rect x="146" y="316" width="118" height="20" rx="10" fill="#ffffff" opacity="0.6"/>

  <!-- sparkles -->
  <path d="M400 70c6 38 16 48 54 54c-38 6-48 16-54 54c-6-38-16-48-54-54c38-6 48-16 54-54z" fill="#ffffff"/>
  <path d="M334 62c3 17 8 22 25 25c-17 3-22 8-25 25c-3-17-8-22-25-25c17-3 22-8 25-25z" fill="#ffffff" opacity="0.85"/>
</svg>
